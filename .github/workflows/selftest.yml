name: self-test

# Who watches the watchmen. `validate` is only worth having if its checks can
# actually fail, so this breaks a known-good keycap on purpose - one defect at
# a time - and asserts that the specific check meant to catch that defect is
# the one that reports FAIL.
#
# It runs on any change to the tooling or the shared library, which is where a
# check can quietly stop working.

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "lib/**"
      - ".github/workflows/selftest.yml"
      - requirements.txt
  pull_request:
    paths:
      - "tools/**"
      - "lib/**"
      - ".github/workflows/selftest.yml"
      - requirements.txt
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENSCAD_SNAPSHOT: "2026.09.27"
  # headless: export to STL needs no display, but Qt still wants a platform
  QT_QPA_PLATFORM: offscreen

jobs:
  selftest:
    name: the checks can fail
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System libraries and fonts
        run: |
          sudo apt-get update -qq
          # urw-base35 gives fontconfig a metric-compatible Nimbus Sans to
          # substitute for Helvetica, which a text legend asks for. Without it
          # the substitute is arbitrary and the engraved glyph changes shape.
          #
          # The rest is the graphics/Qt runtime. An AppImage bundles the
          # application's own libraries but deliberately expects the system to
          # provide the GL/EGL stack, so without these it dies with
          # "libEGL.so.1: cannot open shared object file" before printing its
          # own version.
          sudo apt-get install -y --no-install-recommends \
            fonts-urw-base35 fonts-liberation \
            libegl1 libgl1 libglx0 libopengl0 libglu1-mesa \
            libfontconfig1 libfreetype6 libdbus-1-3 \
            libxi6 libxrender1 libxrandr2 libxcursor1 libxinerama1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1

      - name: Cache OpenSCAD
        id: cache-openscad
        uses: actions/cache@v4
        with:
          path: /opt/openscad
          key: openscad-${{ runner.os }}-${{ env.OPENSCAD_SNAPSHOT }}

      - name: Install OpenSCAD
        if: steps.cache-openscad.outputs.cache-hit != 'true'
        run: bash .github/scripts/install-openscad.sh

      - name: Link cached OpenSCAD
        if: steps.cache-openscad.outputs.cache-hit == 'true'
        run: |
          sudo ln -sf /opt/openscad/AppRun /usr/local/bin/openscad
          openscad --version 2>&1 | head -1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Break the models on purpose
        run: python tools/selftest.py
